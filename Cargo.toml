[workspace]
resolver = "3"
members = [
    "crates/chaos-api",
    "crates/chaos-application",
    "crates/chaos-domain",
    "crates/chaos-infrastructure",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
aes-gcm = { version = "0.11.0", default-features = false, features = ["aes", "alloc"] }
anyhow = "1.0"
async-trait = "0.1.91"
aws-sdk-s3 = { version = "1.141.0", default-features = false, features = ["default-https-client", "rt-tokio", "rustls"] }
axum = "0.8.9"
base64 = "0.23.1"
email_address = "0.2.9"
lettre = { version = "0.11.22", default-features = false, features = ["builder", "pool", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "webpki-roots"] }
language-tags = "0.3.2"
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
opentelemetry = "0.32.0"
opentelemetry-otlp = { version = "0.32.0", features = ["trace", "http-proto", "reqwest-blocking-client"] }
opentelemetry_sdk = "0.32.0"
hmac = "0.13.0"
hickory-resolver = { version = "0.26.1", default-features = false, features = ["system-config", "tokio"] }
rand = "0.10.2"
redis = { version = "1.4.1", features = ["tokio-comp"] }
reqwest = { version = "0.13.1", default-features = false, features = ["form", "json", "query", "rustls-no-provider"] }
rustls = { version = "0.23.18", default-features = false, features = ["ring", "std", "tls12"] }
secrecy = "0.10.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "time", "migrate"] }
thiserror = "2.0"
time = { version = "0.3.44", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7.0", features = ["request-id", "trace"] }
tracing = "0.1"
tracing-opentelemetry = "0.33.0"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.24.0", features = ["serde", "v7"] }
url = "2.5.7"
webauthn-rs = { version = "0.5.5", features = ["danger-allow-state-serialisation"] }
