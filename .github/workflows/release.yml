name: Release

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8.8.1
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@main

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@master
        with:
          shared-key: ci

      - name: Set up Node.js
        uses: actions/setup-node@main
        with:
          node-version: latest

      - name: Install storefront SDK dependencies
        run: npm ci --prefix packages/js

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@master

      - name: Build PostgreSQL image
        uses: docker/build-push-action@master
        with:
          context: ./deploy/postgres
          load: true
          tags: chaos-postgres:release
          cache-from: type=gha,scope=postgres
          cache-to: type=gha,mode=max,scope=postgres

      - name: Start PostgreSQL
        run: |
          docker run -d --name chaos-postgres \
            -e POSTGRES_DB=chaos \
            -e POSTGRES_USER=chaos \
            -e POSTGRES_PASSWORD=chaos \
            -p 5432:5432 \
            chaos-postgres:release \
            postgres \
              -c shared_preload_libraries=pg_cron \
              -c cron.database_name=chaos \
              -c cron.use_background_workers=on

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            if docker exec chaos-postgres pg_isready -U chaos -d chaos; then
              exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL did not become ready in time" >&2
          docker logs chaos-postgres
          exit 1

      - name: Verify repository
        run: |
          node --check scripts/release-version.mjs
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --locked
          npm test --prefix packages/js
          ./scripts/check-language.sh

      - name: Run database migrations
        env:
          DATABASE_URL: postgres://chaos:chaos@127.0.0.1:5432/chaos
        run: cargo run --locked --bin chaos-migrate

      - name: Run integration tests
        env:
          TEST_DATABASE_URL: postgres://chaos:chaos@127.0.0.1:5432/chaos
          TEST_REDIS_URL: redis://127.0.0.1:6379/0
        run: cargo test --workspace --locked -- --include-ignored --test-threads=1

  build-and-push:
    name: Build & push image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@main

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@master

      - name: Log in to GHCR
        uses: docker/login-action@master
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@master
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@master
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release

  publish-sdk:
    name: Publish SDK
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@main

      - name: Set up Node.js
        uses: actions/setup-node@main
        with:
          node-version: latest
          registry-url: "https://npm.pkg.github.com"

      - name: Install dependencies
        run: npm ci --prefix packages/js

      - name: Synchronize release versions
        run: node scripts/release-version.mjs "${GITHUB_REF_NAME}"

      - name: Build
        run: npm run build --prefix packages/js

      - name: Publish
        working-directory: packages/js
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
