name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  lint:
    name: Format & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@master
        with:
          shared-key: lint

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Check repository language convention
        run: ./scripts/check-language.sh

  unit:
    name: Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@master
        with:
          shared-key: test

      - name: Run unit tests
        run: cargo test --workspace --locked

      - name: Set up Node.js
        uses: actions/setup-node@main
        with:
          node-version: "22"

      - name: Install storefront SDK dependencies
        run: npm ci --prefix packages/js

      - name: Test storefront SDK
        run: npm test --prefix packages/js

      - name: Install storefront template dependencies
        run: npm ci --prefix packages/storefront-template

      - name: Typecheck and build storefront template
        run: npm run build --prefix packages/storefront-template

  integration:
    name: Integration
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' }}
    services:
      redis:
        image: redis:8.8.1
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@main

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@master

      - name: Build Postgres image
        uses: docker/build-push-action@master
        with:
          context: ./deploy/postgres
          load: true
          tags: chaos-postgres:ci
          cache-from: type=gha,scope=postgres
          cache-to: type=gha,mode=max,scope=postgres

      - name: Start Postgres
        run: |
          docker run -d --name chaos-postgres \
            -e POSTGRES_DB=chaos \
            -e POSTGRES_USER=chaos \
            -e POSTGRES_PASSWORD=chaos \
            -p 5432:5432 \
            chaos-postgres:ci \
            postgres \
              -c shared_preload_libraries=pg_cron \
              -c cron.database_name=chaos \
              -c cron.use_background_workers=on

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            if docker exec chaos-postgres pg_isready -U chaos -d chaos; then
              exit 0
            fi
            sleep 2
          done
          echo "Postgres did not become ready in time" >&2
          docker logs chaos-postgres
          exit 1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@master
        with:
          shared-key: test

      - name: Run database migrations
        env:
          DATABASE_URL: postgres://chaos:chaos@127.0.0.1:5432/chaos
        run: cargo run --locked --bin chaos-migrate

      - name: Run integration tests
        env:
          TEST_DATABASE_URL: postgres://chaos:chaos@127.0.0.1:5432/chaos
          TEST_REDIS_URL: redis://127.0.0.1:6379/0
        run: cargo test --workspace --locked -- --include-ignored
