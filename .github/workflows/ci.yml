name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@master
        with:
          shared-key: lint

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Check repository language convention
        run: ./scripts/check-language.sh

  unit:
    name: Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@master
        with:
          shared-key: ci

      - name: Run unit tests
        run: cargo test --workspace --locked

      - name: Set up Node.js
        uses: actions/setup-node@main
        with:
          node-version: latest

      - name: Install storefront SDK dependencies
        run: npm ci --prefix packages/js

      - name: Test storefront SDK
        run: npm test --prefix packages/js

      - name: Install storefront template dependencies
        run: npm ci --prefix packages/storefront-template

      - name: Typecheck and build storefront template
        run: npm run build --prefix packages/storefront-template
