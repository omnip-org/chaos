name: chaos

services:
  postgres:
    image: chaos-postgres:18.4
    build:
      context: ./deploy/postgres
    environment:
      POSTGRES_DB: chaos
      POSTGRES_USER: chaos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chaos}
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_cron
      - -c
      - cron.database_name=chaos
      - -c
      - cron.use_background_workers=on
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chaos -d chaos"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.8.1
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:56379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.30.0
    ports:
      - "127.0.0.1:51025:1025"
      - "127.0.0.1:58025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
