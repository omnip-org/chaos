name: chaos

x-api: &api
  image: ${CHAOS_IMAGE}
  restart: unless-stopped
  stop_grace_period: 45s
  env_file:
    - path: .env
      required: true
  expose:
    - "8080"
  depends_on:
    migrate:
      condition: service_completed_successfully
  healthcheck:
    test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/ready"]
    interval: 5s
    timeout: 3s
    retries: 10

services:
  api-blue:
    <<: *api

  api-green:
    <<: *api

  worker:
    image: ${CHAOS_IMAGE}
    restart: unless-stopped
    stop_grace_period: 45s
    entrypoint: ["/usr/local/bin/chaos-worker"]
    env_file:
      - path: .env
        required: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 5

  migrate:
    image: ${CHAOS_IMAGE}
    restart: "no"
    entrypoint: ["/usr/local/bin/chaos-migrate"]
    environment:
      DATABASE_URL: ${DATABASE_URL}

  # Local-only PostgreSQL. Production points DATABASE_URL at a managed database
  # (Supabase). Bring this up for local dev with:
  #   docker compose -f deploy/docker-compose.yaml --profile local up -d postgres
  postgres:
    profiles: ["local"]
    build:
      context: ./postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: ["postgres", "-c", "shared_preload_libraries=pg_cron,pg_partman_bgw", "-c", "cron.database_name=${POSTGRES_DB}", "-c", "cron.use_background_workers=on"]
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

# Give every container outbound IPv6 so migrate/api/worker can reach Supabase's
# IPv6-only direct database endpoint (db.<ref>.supabase.co). The host has global
# IPv6 but Docker containers don't by default. Docker masquerades (NAT66) this
# ULA range to the host's IPv6 address. Needs Docker Engine >= 26.0; the explicit
# subnet also covers 26.0-27.0, which can't auto-allocate one. Harmless (just
# unused) when DATABASE_URL points at the IPv4 pooler (...pooler.supabase.com).
networks:
  default:
    enable_ipv6: true
    ipam:
      config:
        - subnet: fd2c:0a05:5eed::/64

# docker volume create chaos-postgres-data
# docker volume create chaos-redis-data
volumes:
  postgres-data:
    external: true
    name: chaos-postgres-data
  redis-data:
    external: true
    name: chaos-redis-data
