name: chaos

x-api: &api
  image: ${CHAOS_IMAGE}
  restart: unless-stopped
  stop_grace_period: 45s
  env_file:
    - path: .env
      required: true
  expose:
    - "8080"
  depends_on:
    migrate:
      condition: service_completed_successfully
  healthcheck:
    test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/ready"]
    interval: 5s
    timeout: 3s
    retries: 10

services:
  api-blue:
    <<: *api

  api-green:
    <<: *api

  migrate:
    image: ${CHAOS_IMAGE}
    restart: "no"
    entrypoint: ["/usr/local/bin/chaos-migrate"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    build:
      context: ./postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: ["postgres", "-c", "shared_preload_libraries=pg_cron,pg_partman_bgw", "-c", "cron.database_name=${POSTGRES_DB}", "-c", "cron.use_background_workers=on"]
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

# docker volume create chaos-postgres-data
# docker volume create chaos-redis-data
volumes:
  postgres-data:
    external: true
    name: chaos-postgres-data
  redis-data:
    external: true
    name: chaos-redis-data
