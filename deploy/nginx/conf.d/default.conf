include /etc/nginx/conf.d/active-upstream.conf;

server {
    listen 80;
    listen [::]:80;
    server_name chaos.omnip.org;

    if ($cf_allowed = 0) {
        return 403;
    }

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name chaos.omnip.org;

    if ($cf_allowed = 0) {
        return 403;
    }

    ssl_certificate     /etc/nginx/certs/omnip.org.crt;
    ssl_certificate_key /etc/nginx/certs/omnip.org.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 20m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Accept, Authorization, Content-Type, Idempotency-Key, If-Match, X-Chaos-Shopper-Token, X-Request-ID" always;
    add_header Access-Control-Expose-Headers "Retry-After, X-Request-ID" always;
    add_header Access-Control-Max-Age 86400 always;
    add_header Vary Origin always;

    # Provider callbacks: never rate-limit. Stripe retries from a small fixed
    # IP set and a 429 there drops a verified event.
    location /webhooks/ {
        if ($request_method = OPTIONS) { return 204; }
        include /etc/nginx/conf.d/proxy-backend.conf;
    }

    # Readiness/liveness probes bypass the request ceiling.
    location /health/ {
        include /etc/nginx/conf.d/proxy-backend.conf;
    }

    location / {
        if ($request_method = OPTIONS) { return 204; }
        limit_req  zone=api_general burst=20 nodelay;
        limit_conn api_conn 20;
        include /etc/nginx/conf.d/proxy-backend.conf;
    }
}
