groups:
  - name: chaos
    rules:
      - alert: ChaosWorkerUnavailable
        expr: chaos_worker_healthy == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Chaos Worker heartbeat is stale
          description: No healthy Chaos Worker heartbeat has been recorded for at least one minute.

      - alert: ChaosQueueDeadLetters
        expr: chaos_outbox_dead_letter > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Chaos has dead-lettered integration work
          description: At least one durable integration delivery exhausted its retries.

      - alert: ChaosQueueBacklogStale
        expr: chaos_outbox_oldest_pending_seconds > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Chaos integration queue is not draining
          description: The oldest pending durable delivery has been waiting for more than five minutes.

      - alert: ChaosDependenciesUnavailable
        expr: chaos_dependencies_healthy == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Chaos runtime dependency check is failing
          description: PostgreSQL or Redis has remained unavailable for at least two minutes.
