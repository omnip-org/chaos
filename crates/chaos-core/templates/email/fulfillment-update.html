<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{brand_name}} · {{headline}}</title>
  </head>
  <body style="margin:0;background:{{background_color}};color:{{text_color}};font-family:Arial,Helvetica,sans-serif;line-height:1.5">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:{{background_color}}">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:600px;background:{{surface_color}};padding:24px 20px">
            <tr>
              <td>
                <table role="presentation" cellspacing="0" cellpadding="0" style="height:36px;margin:0 0 24px;color:{{primary_color}};font-size:16px;font-weight:700">
                  <tr><td>{{brand_header_html}}</td></tr>
                </table>
                <p style="margin:0 0 4px;color:{{muted_text_color}};font-size:12px;font-weight:600">{{label}}</p>
                <h1 style="margin:0 0 16px;color:{{text_color}};font-size:20px;line-height:1.3;font-weight:700">{{headline}}</h1>
                <p style="margin:0 0 24px;color:{{text_color}};font-size:14px">{{body_html}}</p>
                {{tracking_html}}
                <p style="margin:0 0 24px;text-align:center">
                  <a href="{{lookup_url}}" style="display:inline-block;background:{{primary_color}};color:#ffffff;text-decoration:none;border-radius:6px;padding:12px 24px;font-size:14px;font-weight:600">Order Status</a>
                </p>
                <p style="margin:0;color:{{muted_text_color}};font-size:12px;text-align:center">Need help? Just reply to this email.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
