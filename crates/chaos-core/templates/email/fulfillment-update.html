<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{brand_name}} · {{headline}}</title>
  </head>
  <body style="margin:0;background:{{background_color}};color:{{text_color}};font-family:Arial,Helvetica,sans-serif;line-height:1.5">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:32px 16px;background:{{background_color}}">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:600px;background:{{surface_color}};border-radius:16px;padding:32px">
            <tr>
              <td>
                <table role="presentation" cellspacing="0" cellpadding="0" style="height:48px;margin:0 0 28px;color:{{primary_color}};font-size:20px;font-weight:700">
                  <tr><td>{{brand_header_html}}</td></tr>
                </table>
                <p style="margin:0 0 8px;color:{{muted_text_color}};font-size:14px">{{label}}</p>
                <h1 style="margin:0 0 24px;color:{{text_color}};font-size:28px;line-height:1.2">{{headline}}</h1>
                <p style="margin:0 0 24px;color:{{text_color}}">{{body_html}}</p>
                {{tracking_html}}
                <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="margin:0 0 24px;border:1px solid {{accent_color}};border-radius:8px">
                  <tr>
                    <td style="padding:12px 16px;color:{{muted_text_color}}">Order</td>
                    <td align="right" style="padding:12px 16px;color:{{text_color}};font-weight:600">{{order_number}}</td>
                  </tr>
                </table>
                <p style="margin:0 0 24px">
                  <a href="{{lookup_url}}" style="display:inline-block;background:{{primary_color}};color:#ffffff;text-decoration:none;border-radius:8px;padding:12px 18px">View your order</a>
                </p>
                <p style="margin:0 0 12px;color:{{muted_text_color}};font-size:14px">Need help? Just reply to this email.</p>
                <p style="margin:0;color:{{muted_text_color}};font-size:14px">Thank you for shopping with us.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
