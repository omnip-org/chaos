name: chaos

x-api: &api
  image: ${CHAOS_IMAGE:-ghcr.io/omnip-org/chaos:latest}
  env_file:
    - path: .env
      required: true
  expose:
    - "8080"
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/ready"]
    interval: 2s
    timeout: 1s
    retries: 15
    start_period: 2s
  stop_grace_period: 45s
  restart: unless-stopped

services:
  api-blue:
    <<: *api

  api-green:
    <<: *api

  migrate:
    image: ${CHAOS_IMAGE:-ghcr.io/omnip-org/chaos:latest}
    entrypoint: ["/usr/local/bin/chaos-migrate"]
    env_file:
      - path: .env
        required: true
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: chaos-postgres:18.4
    build:
      context: ./deploy/postgres
    env_file:
      - path: .env
        required: true
    command: ["postgres", "-c", "shared_preload_libraries=pg_cron", "-c", "cron.database_name=chaos", "-c", "cron.use_background_workers=on"]
    ports:
      - "127.0.0.1:54320:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chaos -d chaos"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:63790:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    image: caddy:2-alpine
    ports:
      - "${HTTP_PORT:-8080}:8080"
    volumes:
      - ./deploy/compose/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      api-blue:
        condition: service_healthy
      api-green:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:8080/health/gateway"]
      interval: 5s
      timeout: 1s
      retries: 5
    restart: unless-stopped

# docker volume create chaos-postgres-data
# docker volume create chaos-redis-data
volumes:
  postgres-data:
    external: true
    name: chaos-postgres-data
  redis-data:
    external: true
    name: chaos-redis-data
